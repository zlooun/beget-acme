# Mount the entire output tree, including current and its version directories.
server {
    listen 8443 ssl;
    server_name example.com *.example.com;

    ssl_certificate     /etc/nginx/certs/production/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/production/current/privkey.pem;

    # Replace this response with your reverse-proxy configuration.
    location / {
        default_type text/plain;
        return 200 "TLS is ready.\n";
    }
}
