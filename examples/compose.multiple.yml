services:
  site-a:
    image: ${BEGET_ACME_IMAGE:-beget-acme:local}
    build: .
    user: '${APP_UID:-0}:${APP_GID:-0}'
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    env_file: site-a.env
    environment:
      ACME_STATE_DIR: /state
      ACME_OUTPUT_DIR: /output
    volumes:
      - type: bind
        source: ./state-a
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: ./output-a
        target: /output
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 80
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  site-b:
    image: ${BEGET_ACME_IMAGE:-beget-acme:local}
    build: .
    user: '${APP_UID:-0}:${APP_GID:-0}'
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    env_file: site-b.env
    environment:
      ACME_STATE_DIR: /state
      ACME_OUTPUT_DIR: /output
    volumes:
      - type: bind
        source: ./state-b
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: ./output-b
        target: /output
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 80
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
