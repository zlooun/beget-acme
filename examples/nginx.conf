# Example: mount the complete Beget ACME output directory read-only into Nginx.
# Ensure the Nginx process can read the certificate key (UID/GID or ACL).
server {
    listen 443 ssl;
    server_name example.com *.example.com;

    ssl_certificate     /acme-certs/production/current/fullchain.pem;
    ssl_certificate_key /acme-certs/production/current/privkey.pem;

    location / {
        proxy_pass http://your-lan-service:8080;
    }
}
