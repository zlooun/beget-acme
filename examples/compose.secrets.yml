# Optional overlay: remove inline credentials from .env before using this file.
services:
  beget-acme:
    environment:
      BEGET_USERNAME: ''
      BEGET_PASSWORD: ''
      BEGET_USERNAME_FILE: /run/secrets/beget_username
      BEGET_PASSWORD_FILE: /run/secrets/beget_password
    secrets:
      - beget_username
      - beget_password
secrets:
  beget_username:
    file: ./secrets/username.txt
  beget_password:
    file: ./secrets/password.txt
